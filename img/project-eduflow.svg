<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t">
  <title id="t">EDUFLOW learning path generator</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#010810"/><stop offset=".6" stop-color="#061522"/><stop offset="1" stop-color="#0a1e30"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00c896" stop-opacity=".25"/><stop offset="1" stop-color="#00c896" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#96afc8" opacity=".14"/></pattern>
  </defs>
  <rect width="900" height="600" fill="url(#bg)"/><rect width="900" height="600" fill="url(#dots)"/>
  <circle cx="680" cy="300" r="290" fill="url(#glow)"/>
  <!-- Prerequisite graph: a learning path through the courses -->
  <g transform="translate(-40 0)">
  <g stroke="#2c4a6e" stroke-width="3" fill="none">
    <path d="M560 170 L650 250"/><path d="M560 170 L520 290"/><path d="M650 250 L760 210"/><path d="M650 250 L700 360"/>
    <path d="M520 290 L600 400"/><path d="M700 360 L800 330"/><path d="M700 360 L640 470"/><path d="M600 400 L640 470"/>
  </g>
  <g stroke="#2fffc0" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M560 170 L650 250 L700 360 L640 470"/>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="560" cy="170" r="30" fill="#0a1e30" stroke="#2fffc0" stroke-width="3"/><text x="560" y="175" fill="#e2eeff">Intro</text>
    <circle cx="650" cy="250" r="30" fill="#0a1e30" stroke="#2fffc0" stroke-width="3"/><text x="650" y="255" fill="#e2eeff">DS</text>
    <circle cx="520" cy="290" r="26" fill="#0a1e30" stroke="#2c4a6e" stroke-width="3"/><text x="520" y="295" fill="#96afc8">Web</text>
    <circle cx="760" cy="210" r="26" fill="#0a1e30" stroke="#2c4a6e" stroke-width="3"/><text x="760" y="215" fill="#96afc8">DB</text>
    <circle cx="700" cy="360" r="30" fill="#0a1e30" stroke="#2fffc0" stroke-width="3"/><text x="700" y="365" fill="#e2eeff">ML</text>
    <circle cx="600" cy="400" r="26" fill="#0a1e30" stroke="#2c4a6e" stroke-width="3"/><text x="600" y="405" fill="#96afc8">API</text>
    <circle cx="800" cy="330" r="26" fill="#0a1e30" stroke="#2c4a6e" stroke-width="3"/><text x="800" y="335" fill="#96afc8">Algo</text>
    <circle cx="640" cy="470" r="32" fill="#00c896"/><text x="640" y="475" fill="#00140e">DL</text>
  </g>
  </g>
  <g transform="translate(0 46)">
    <text x="70" y="150" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#2fffc0" letter-spacing="4">C++ · DATA STRUCTURES</text>
    <text x="68" y="226" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#e2eeff" letter-spacing="-1.5">EDUFLOW</text>
    <text x="70" y="270" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#96afc8">Score courses · follow prerequisites</text>
    <text x="70" y="298" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#96afc8">· plan the week</text>
    <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700">
      <rect x="70" y="330" width="96" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="118" y="352" text-anchor="middle" fill="#e2eeff">AVL tree</text>
      <rect x="178" y="330" width="78" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="217" y="352" text-anchor="middle" fill="#e2eeff">Graph</text>
      <rect x="268" y="330" width="62" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="299" y="352" text-anchor="middle" fill="#e2eeff">BST</text>
    </g>
