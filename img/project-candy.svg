<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t">
<title id="t">Candy Line Sales Overview dashboard</title>
<style>
.up{transform-box:fill-box;transform-origin:50% 100%;animation:up 7s cubic-bezier(.2,.8,.2,1) infinite both}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 7s cubic-bezier(.2,.8,.2,1) infinite both}
.in{animation:in 7s ease infinite both}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 7s cubic-bezier(.3,1.4,.5,1) infinite both}
.ring{transform-box:fill-box;transform-origin:50% 50%;animation:ring 2.4s ease-out infinite}
.bob{animation:bob 3.2s ease-in-out infinite alternate}
.flow{stroke-dasharray:8 9;animation:flow 1s linear infinite}
.caret{animation:blink 1.1s steps(1) infinite}
.breathe{transform-box:fill-box;transform-origin:50% 50%;animation:breathe 6s ease-in-out infinite alternate}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes up{0%{transform:scaleY(0)}20%,90%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes grow{0%{transform:scaleX(0)}20%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes in{0%{opacity:0;transform:translateY(10px)}12%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}10%,90%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes bob{from{transform:translateY(-7px)}to{transform:translateY(7px)}}
@keyframes flow{to{stroke-dashoffset:-34}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes breathe{from{transform:scale(.9);opacity:.75}to{transform:scale(1.08);opacity:1}}
@keyframes sheen{0%{transform:translateX(0)}30%,100%{transform:translateX(1500px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.donut{stroke-dasharray:68.6 175.9;animation:donut 7s ease-out infinite .4s both}@keyframes donut{0%{stroke-dasharray:0 175.9}25%,90%{stroke-dasharray:68.6 175.9}100%{stroke-dasharray:0 175.9}}.dr781{stroke-dasharray:781;animation:dr781 7s ease-in-out infinite both}@keyframes dr781{0%{stroke-dashoffset:781}30%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:-781}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#010810"/><stop offset=".6" stop-color="#061522"/><stop offset="1" stop-color="#0a1e30"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00c896" stop-opacity=".3"/><stop offset="1" stop-color="#00c896" stop-opacity="0"/></radialGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#96afc8" opacity=".14"/></pattern>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00c896" stop-opacity=".4"/><stop offset="1" stop-color="#00c896" stop-opacity="0"/></linearGradient>
</defs>
<rect width="900" height="600" fill="url(#bg)"/>
<rect width="900" height="600" fill="url(#dots)"/>
<circle class="breathe" cx="670" cy="300" r="290" fill="url(#glow)"/>
<g transform="translate(470 108)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="380" height="384" rx="18" fill="#0f1826" stroke="#2c4a6e" stroke-width="2"/>
<g class="in" style="animation-delay:0.10s"><rect x="20" y="20" width="160" height="72" rx="10" fill="#172232"/>
<text x="34" y="44" font-size="12" fill="#96afc8">Total sales</text><text x="34" y="77" font-size="27" font-weight="800" fill="#eef3f9">$10.03M</text></g>
<g transform="translate(228 56)"><circle r="28" fill="none" stroke="#2c4a6e" stroke-width="11"/>
<circle class="donut" r="28" fill="none" stroke="#00c896" stroke-width="11" transform="rotate(-90)"/>
<text y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#e2eeff">39%</text></g>
<text x="270" y="52" font-size="13" font-weight="700" fill="#e2eeff">Classic</text><text x="270" y="69" font-size="13" font-weight="700" fill="#e2eeff">Cars</text>
<text x="20" y="132" font-size="13" font-weight="700" fill="#96afc8">Monthly sales, 2003–2005</text>
<line x1="20" y1="334" x2="360" y2="334" stroke="#2f3d50" stroke-width="1.5"/>
<path class="in" d="M24 315.2 L35.9 313.6 L47.7 308.7 L59.6 304.8 L71.4 306 L83.3 309.6 L95.1 306.8 L107 305.3 L118.9 295.7 L130.7 251.6 L142.6 184.6 L154.4 296 L166.3 288.1 L178.1 288.8 L190 304.2 L201.9 304.1 L213.7 294.3 L225.6 292.4 L237.4 286.5 L249.3 267 L261.1 287.5 L273 253.8 L284.9 176 L296.7 279.9 L308.6 284.7 L320.4 282 L332.3 279.7 L344.1 296 L356 267.6 L356 334 L24 334 Z" fill="url(#area)" style="animation-delay:1.20s"/>
<path class="dr781" d="M24 315.2 L35.9 313.6 L47.7 308.7 L59.6 304.8 L71.4 306 L83.3 309.6 L95.1 306.8 L107 305.3 L118.9 295.7 L130.7 251.6 L142.6 184.6 L154.4 296 L166.3 288.1 L178.1 288.8 L190 304.2 L201.9 304.1 L213.7 294.3 L225.6 292.4 L237.4 286.5 L249.3 267 L261.1 287.5 L273 253.8 L284.9 176 L296.7 279.9 L308.6 284.7 L320.4 282 L332.3 279.7 L344.1 296 L356 267.6" fill="none" stroke="#00c896" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="animation-delay:0.40s"/>
<circle class="ring" cx="142.6" cy="184.6" r="6" fill="none" stroke="#f5c842" stroke-width="2"/><g class="pop" style="animation-delay:2.20s"><circle cx="142.6" cy="184.6" r="5" fill="#f5c842"/><text x="142.6" y="172.6" text-anchor="middle" font-size="13" font-weight="800" fill="#f5c842">Nov</text></g><circle class="ring" cx="284.9" cy="176" r="6" fill="none" stroke="#f5c842" stroke-width="2"/><g class="pop" style="animation-delay:2.50s"><circle cx="284.9" cy="176" r="5" fill="#f5c842"/><text x="284.9" y="164" text-anchor="middle" font-size="13" font-weight="800" fill="#f5c842">Nov</text></g>
<text x="24" y="356" text-anchor="start" font-size="13" fill="#96afc8">2003</text><text x="166.3" y="356" text-anchor="middle" font-size="13" fill="#96afc8">2004</text><text x="308.6" y="356" text-anchor="middle" font-size="13" fill="#96afc8">2005</text>
</g>
<g transform="translate(0 46)">
<text x="70" y="150" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#2fffc0" letter-spacing="4">LIVE DASHBOARD</text>
<rect class="caret" x="273" y="135" width="10" height="18" fill="#2fffc0"/>
<text x="68" y="222" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#e2eeff" letter-spacing="-1.5">Candy Line</text>
<text x="68" y="286" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#e2eeff" letter-spacing="-1.5">Sales</text>
<text x="70" y="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#96afc8">307 orders · 7 product lines · 19 countries</text>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700"><rect x="70" y="372" width="73" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="106.5" y="394" text-anchor="middle" fill="#e2eeff">Excel</text><rect x="155" y="372" width="116" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="213" y="394" text-anchor="middle" fill="#e2eeff">Statistics</text><rect x="283" y="372" width="99" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="332.5" y="394" text-anchor="middle" fill="#e2eeff">Chart.js</text></g>
</g>
<g transform="skewX(-18)"><rect class="sheen" x="-420" y="0" width="220" height="600" fill="url(#sh)"/></g>
</svg>
