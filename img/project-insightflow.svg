<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t">
<title id="t">InsightFlow sales and profit dashboard</title>
<style>
.up{transform-box:fill-box;transform-origin:50% 100%;animation:up 7s cubic-bezier(.2,.8,.2,1) infinite both}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 7s cubic-bezier(.2,.8,.2,1) infinite both}
.in{animation:in 7s ease infinite both}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 7s cubic-bezier(.3,1.4,.5,1) infinite both}
.ring{transform-box:fill-box;transform-origin:50% 50%;animation:ring 2.4s ease-out infinite}
.bob{animation:bob 3.2s ease-in-out infinite alternate}
.flow{stroke-dasharray:8 9;animation:flow 1s linear infinite}
.caret{animation:blink 1.1s steps(1) infinite}
.breathe{transform-box:fill-box;transform-origin:50% 50%;animation:breathe 6s ease-in-out infinite alternate}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes up{0%{transform:scaleY(0)}20%,90%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes grow{0%{transform:scaleX(0)}20%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes in{0%{opacity:0;transform:translateY(10px)}12%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}10%,90%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes bob{from{transform:translateY(-7px)}to{transform:translateY(7px)}}
@keyframes flow{to{stroke-dashoffset:-34}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes breathe{from{transform:scale(.9);opacity:.75}to{transform:scale(1.08);opacity:1}}
@keyframes sheen{0%{transform:translateX(0)}30%,100%{transform:translateX(1500px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#010810"/><stop offset=".6" stop-color="#061522"/><stop offset="1" stop-color="#0a1e30"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00c896" stop-opacity=".3"/><stop offset="1" stop-color="#00c896" stop-opacity="0"/></radialGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#96afc8" opacity=".14"/></pattern>

</defs>
<rect width="900" height="600" fill="url(#bg)"/>
<rect width="900" height="600" fill="url(#dots)"/>
<circle class="breathe" cx="670" cy="300" r="290" fill="url(#glow)"/>
<g transform="translate(470 108)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="380" height="384" rx="18" fill="#0f1826" stroke="#2c4a6e" stroke-width="2"/>
<rect x="20" y="20" width="340" height="230" rx="10" fill="#0b1522"/>
<rect x="20" y="20" width="340" height="230" rx="10" fill="url(#dots)"/>
<text x="34" y="46" font-size="13" font-weight="700" fill="#96afc8">Sales by city</text>
<path class="flow" d="M80 110 L190 80" stroke="#3987e5" stroke-opacity=".7" stroke-width="2" fill="none"/><path class="flow" d="M190 80 L300 130" stroke="#3987e5" stroke-opacity=".7" stroke-width="2" fill="none"/><path class="flow" d="M300 130 L130 200" stroke="#3987e5" stroke-opacity=".7" stroke-width="2" fill="none"/><path class="flow" d="M130 200 L250 220" stroke="#3987e5" stroke-opacity=".7" stroke-width="2" fill="none"/><circle class="ring" cx="80" cy="110" r="9" fill="none" stroke="#2fffc0" stroke-width="2" style="animation-delay:0.00s"/><g class="pop" style="animation-delay:0.20s"><circle cx="80" cy="110" r="8" fill="#2fffc0" stroke="#0f1826" stroke-width="3"/></g><circle class="ring" cx="190" cy="80" r="9" fill="none" stroke="#2fffc0" stroke-width="2" style="animation-delay:0.45s"/><g class="pop" style="animation-delay:0.35s"><circle cx="190" cy="80" r="8" fill="#2fffc0" stroke="#0f1826" stroke-width="3"/></g><circle class="ring" cx="300" cy="130" r="9" fill="none" stroke="#2fffc0" stroke-width="2" style="animation-delay:0.90s"/><g class="pop" style="animation-delay:0.50s"><circle cx="300" cy="130" r="8" fill="#2fffc0" stroke="#0f1826" stroke-width="3"/></g><circle class="ring" cx="130" cy="200" r="9" fill="none" stroke="#2fffc0" stroke-width="2" style="animation-delay:1.35s"/><g class="pop" style="animation-delay:0.65s"><circle cx="130" cy="200" r="8" fill="#2fffc0" stroke="#0f1826" stroke-width="3"/></g><circle class="ring" cx="250" cy="220" r="9" fill="none" stroke="#2fffc0" stroke-width="2" style="animation-delay:1.80s"/><g class="pop" style="animation-delay:0.80s"><circle cx="250" cy="220" r="8" fill="#2fffc0" stroke="#0f1826" stroke-width="3"/></g>
<line x1="20" y1="352" x2="360" y2="352" stroke="#2f3d50" stroke-width="1.5"/>
<g font-size="12" fill="#96afc8"><circle cx="34" cy="270" r="5" fill="#3987e5"/><text x="44" y="274">Sales</text>
<circle cx="96" cy="270" r="5" fill="#00c896"/><text x="106" y="274">Profit</text></g>
<rect class="up" x="30" y="322" width="14" height="30" rx="3" fill="#3987e5" style="animation-delay:0.80s"/><rect class="up" x="46" y="338" width="14" height="14" rx="3" fill="#00c896" style="animation-delay:0.85s"/><rect class="up" x="70" y="310" width="14" height="42" rx="3" fill="#3987e5" style="animation-delay:0.88s"/><rect class="up" x="86" y="334" width="14" height="18" rx="3" fill="#00c896" style="animation-delay:0.93s"/><rect class="up" x="110" y="316" width="14" height="36" rx="3" fill="#3987e5" style="animation-delay:0.96s"/><rect class="up" x="126" y="337" width="14" height="15" rx="3" fill="#00c896" style="animation-delay:1.01s"/><rect class="up" x="150" y="304" width="14" height="48" rx="3" fill="#3987e5" style="animation-delay:1.04s"/><rect class="up" x="166" y="329" width="14" height="23" rx="3" fill="#00c896" style="animation-delay:1.09s"/><rect class="up" x="190" y="298" width="14" height="54" rx="3" fill="#3987e5" style="animation-delay:1.12s"/><rect class="up" x="206" y="326" width="14" height="26" rx="3" fill="#00c896" style="animation-delay:1.17s"/><rect class="up" x="230" y="302" width="14" height="50" rx="3" fill="#3987e5" style="animation-delay:1.20s"/><rect class="up" x="246" y="328" width="14" height="24" rx="3" fill="#00c896" style="animation-delay:1.25s"/><rect class="up" x="270" y="290" width="14" height="62" rx="3" fill="#3987e5" style="animation-delay:1.28s"/><rect class="up" x="286" y="321" width="14" height="31" rx="3" fill="#00c896" style="animation-delay:1.33s"/><rect class="up" x="310" y="282" width="14" height="70" rx="3" fill="#3987e5" style="animation-delay:1.36s"/><rect class="up" x="326" y="316" width="14" height="36" rx="3" fill="#00c896" style="animation-delay:1.41s"/>
</g>
<g transform="translate(0 46)">
<text x="70" y="150" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#2fffc0" letter-spacing="4">POWER BI · EXCEL</text>
<rect class="caret" x="301" y="135" width="10" height="18" fill="#2fffc0"/>
<text x="68" y="226" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="800" fill="#e2eeff" letter-spacing="-1.5">InsightFlow</text>
<text x="70" y="270" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#96afc8">Sales and profit by city</text>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700"><rect x="70" y="312" width="99" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="119.5" y="334" text-anchor="middle" fill="#e2eeff">Power BI</text><rect x="181" y="312" width="73" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="217.5" y="334" text-anchor="middle" fill="#e2eeff">Excel</text></g>
</g>
<g transform="skewX(-18)"><rect class="sheen" x="-420" y="0" width="220" height="600" fill="url(#sh)"/></g>
</svg>
