<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t">
<title id="t">Finance Flare</title>
<style>
.up{transform-box:fill-box;transform-origin:50% 100%;animation:up 7s cubic-bezier(.2,.8,.2,1) infinite both}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 7s cubic-bezier(.2,.8,.2,1) infinite both}
.in{animation:in 7s ease infinite both}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 7s cubic-bezier(.3,1.4,.5,1) infinite both}
.ring{transform-box:fill-box;transform-origin:50% 50%;animation:ring 2.4s ease-out infinite}
.bob{animation:bob 3.2s ease-in-out infinite alternate}
.flow{stroke-dasharray:8 9;animation:flow 1s linear infinite}
.caret{animation:blink 1.1s steps(1) infinite}
.breathe{transform-box:fill-box;transform-origin:50% 50%;animation:breathe 6s ease-in-out infinite alternate}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes up{0%{transform:scaleY(0)}20%,90%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes grow{0%{transform:scaleX(0)}20%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes in{0%{opacity:0;transform:translateY(10px)}12%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}10%,90%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes bob{from{transform:translateY(-7px)}to{transform:translateY(7px)}}
@keyframes flow{to{stroke-dashoffset:-34}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes breathe{from{transform:scale(.9);opacity:.75}to{transform:scale(1.08);opacity:1}}
@keyframes sheen{0%{transform:translateX(0)}30%,100%{transform:translateX(1500px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.dr233{stroke-dasharray:233;animation:dr233 7s ease-in-out infinite both}@keyframes dr233{0%{stroke-dashoffset:233}30%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:-233}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#010810"/><stop offset=".6" stop-color="#061522"/><stop offset="1" stop-color="#0a1e30"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f5c842" stop-opacity=".3"/><stop offset="1" stop-color="#f5c842" stop-opacity="0"/></radialGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#96afc8" opacity=".14"/></pattern>

</defs>
<rect width="900" height="600" fill="url(#bg)"/>
<rect width="900" height="600" fill="url(#dots)"/>
<circle class="breathe" cx="670" cy="300" r="290" fill="url(#glow)"/>
<g transform="translate(470 120)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="380" height="350" rx="18" fill="#0f1826" stroke="#2c4a6e" stroke-width="2"/>
<text x="24" y="40" font-size="15" font-weight="700" fill="#e2eeff">Cash flow</text>
<g font-size="12" fill="#96afc8"><circle cx="170" cy="36" r="5" fill="#00c896"/><text x="180" y="40">Income</text>
<circle cx="240" cy="36" r="5" fill="#d95926"/><text x="250" y="40">Expenses</text>
<line x1="314" y1="36" x2="330" y2="36" stroke="#f5c842" stroke-width="2.5" stroke-dasharray="4 3"/><text x="334" y="40">Return</text></g>
<line x1="20" y1="300" x2="360" y2="300" stroke="#2f3d50" stroke-width="1.5"/>
<line x1="300" y1="70" x2="300" y2="300" stroke="#2c4a6e" stroke-width="1.5" stroke-dasharray="3 5"/>
<rect class="up" x="34" y="230" width="17" height="70" rx="4" fill="#00c896" style="animation-delay:0.20s"/><rect class="up" x="54" y="245" width="17" height="55" rx="4" fill="#d95926" style="animation-delay:0.26s"/><text x="52" y="322" text-anchor="middle" fill="#96afc8" font-size="12">J</text><rect class="up" x="78" y="215" width="17" height="85" rx="4" fill="#00c896" style="animation-delay:0.32s"/><rect class="up" x="98" y="240" width="17" height="60" rx="4" fill="#d95926" style="animation-delay:0.38s"/><text x="96" y="322" text-anchor="middle" fill="#96afc8" font-size="12">F</text><rect class="up" x="122" y="220" width="17" height="80" rx="4" fill="#00c896" style="animation-delay:0.44s"/><rect class="up" x="142" y="230" width="17" height="70" rx="4" fill="#d95926" style="animation-delay:0.50s"/><text x="140" y="322" text-anchor="middle" fill="#96afc8" font-size="12">M</text><rect class="up" x="166" y="200" width="17" height="100" rx="4" fill="#00c896" style="animation-delay:0.56s"/><rect class="up" x="186" y="235" width="17" height="65" rx="4" fill="#d95926" style="animation-delay:0.62s"/><text x="184" y="322" text-anchor="middle" fill="#96afc8" font-size="12">A</text><rect class="up" x="210" y="190" width="17" height="110" rx="4" fill="#00c896" style="animation-delay:0.68s"/><rect class="up" x="230" y="225" width="17" height="75" rx="4" fill="#d95926" style="animation-delay:0.74s"/><text x="228" y="322" text-anchor="middle" fill="#96afc8" font-size="12">M</text><rect class="up" x="254" y="175" width="17" height="125" rx="4" fill="#00c896" style="animation-delay:0.80s"/><rect class="up" x="274" y="230" width="17" height="70" rx="4" fill="#d95926" style="animation-delay:0.86s"/><text x="272" y="322" text-anchor="middle" fill="#96afc8" font-size="12">J</text>
<path class="dr233" d="M42.5 212 L86.5 197 L130.5 202 L174.5 182 L218.5 172 L262.5 157" fill="none" stroke="#f5c842" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" style="animation-delay:1.00s"/>
<path class="flow" d="M262.5 157 L322 140 L352 112" fill="none" stroke="#f5c842" stroke-width="3" stroke-linecap="round"/>
<circle class="ring" cx="352" cy="112" r="8" fill="none" stroke="#f5c842" stroke-width="2"/>
<circle cx="352" cy="112" r="6" fill="#f5c842"/>
</g>
<g transform="translate(452 452)"><g class="bob">
<circle r="26" fill="#f5c842"/><circle r="19" fill="none" stroke="#a87f10" stroke-width="2"/>
<text y="9" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#5a4205">$</text></g></g>
<g transform="translate(0 46)">
<text x="70" y="150" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#2fffc0" letter-spacing="4">TEAM PROJECT · C++</text>
<rect class="caret" x="330" y="135" width="10" height="18" fill="#2fffc0"/>
<text x="68" y="222" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#e2eeff" letter-spacing="-1.5">Finance</text>
<text x="68" y="286" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#e2eeff" letter-spacing="-1.5">Flare</text>
<text x="70" y="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#96afc8">Income · expenses · investment returns</text>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700"><rect x="70" y="372" width="56" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="98" y="394" text-anchor="middle" fill="#e2eeff">C++</text><rect x="138" y="372" width="56" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="166" y="394" text-anchor="middle" fill="#e2eeff">OOP</text><rect x="206" y="372" width="99" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="255.5" y="394" text-anchor="middle" fill="#e2eeff">File I/O</text></g>
</g>
<g transform="skewX(-18)"><rect class="sheen" x="-420" y="0" width="220" height="600" fill="url(#sh)"/></g>
</svg>
