<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t">
<title id="t">Enterprise Data 360 dashboard</title>
<style>
.up{transform-box:fill-box;transform-origin:50% 100%;animation:up 7s cubic-bezier(.2,.8,.2,1) infinite both}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 7s cubic-bezier(.2,.8,.2,1) infinite both}
.in{animation:in 7s ease infinite both}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 7s cubic-bezier(.3,1.4,.5,1) infinite both}
.ring{transform-box:fill-box;transform-origin:50% 50%;animation:ring 2.4s ease-out infinite}
.bob{animation:bob 3.2s ease-in-out infinite alternate}
.flow{stroke-dasharray:8 9;animation:flow 1s linear infinite}
.caret{animation:blink 1.1s steps(1) infinite}
.breathe{transform-box:fill-box;transform-origin:50% 50%;animation:breathe 6s ease-in-out infinite alternate}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes up{0%{transform:scaleY(0)}20%,90%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes grow{0%{transform:scaleX(0)}20%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes in{0%{opacity:0;transform:translateY(10px)}12%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}10%,90%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes bob{from{transform:translateY(-7px)}to{transform:translateY(7px)}}
@keyframes flow{to{stroke-dashoffset:-34}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes breathe{from{transform:scale(.9);opacity:.75}to{transform:scale(1.08);opacity:1}}
@keyframes sheen{0%{transform:translateX(0)}30%,100%{transform:translateX(1500px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.dr379{stroke-dasharray:379;animation:dr379 7s ease-in-out infinite both}@keyframes dr379{0%{stroke-dashoffset:379}30%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:-379}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#010810"/><stop offset=".6" stop-color="#061522"/><stop offset="1" stop-color="#0a1e30"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00c896" stop-opacity=".3"/><stop offset="1" stop-color="#00c896" stop-opacity="0"/></radialGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#96afc8" opacity=".14"/></pattern>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3987e5" stop-opacity=".45"/><stop offset="1" stop-color="#3987e5" stop-opacity="0"/></linearGradient>
</defs>
<rect width="900" height="600" fill="url(#bg)"/>
<rect width="900" height="600" fill="url(#dots)"/>
<circle class="breathe" cx="670" cy="300" r="290" fill="url(#glow)"/>
<g transform="translate(470 110)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="380" height="380" rx="18" fill="#0f1826" stroke="#2c4a6e" stroke-width="2"/>
<g class="in" style="animation-delay:0.15s"><rect x="20" y="22" width="104" height="62" rx="10" fill="#172232"/><text x="32" y="46" font-size="12" fill="#96afc8">Revenue</text><text x="32" y="72" font-size="21" font-weight="800" fill="#eef3f9">$15.2M</text></g><g class="in" style="animation-delay:0.30s"><rect x="138" y="22" width="104" height="62" rx="10" fill="#172232"/><text x="150" y="46" font-size="12" fill="#96afc8">Customers</text><text x="150" y="72" font-size="21" font-weight="800" fill="#eef3f9">24,563</text></g><g class="in" style="animation-delay:0.45s"><rect x="256" y="22" width="104" height="62" rx="10" fill="#172232"/><text x="268" y="46" font-size="12" fill="#96afc8">NPS</text><text x="268" y="72" font-size="21" font-weight="800" fill="#eef3f9">48</text></g>
<path class="in" d="M20 250 L60 228 L100 238 L140 220 L180 200 L220 214 L260 190 L300 172 L340 150 L360 140 V280 H20 Z" fill="url(#area)" style="animation-delay:1.10s"/>
<path class="dr379" d="M20 250 L60 228 L100 238 L140 220 L180 200 L220 214 L260 190 L300 172 L340 150 L360 140" fill="none" stroke="#3987e5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" style="animation-delay:0.50s"/>
<circle class="ring" cx="360" cy="140" r="7" fill="none" stroke="#3987e5" stroke-width="2"/>
<circle class="pop" cx="360" cy="140" r="6" fill="#3987e5" stroke="#0f1826" stroke-width="3" style="animation-delay:2.40s"/>
<line x1="20" y1="280" x2="360" y2="280" stroke="#2f3d50" stroke-width="1.5"/>
<rect class="grow" x="20" y="302" width="200" height="14" rx="4" fill="#3987e5" style="animation-delay:1.00s"/>
<rect class="grow" x="20" y="324" width="150" height="14" rx="4" fill="#3987e5" style="animation-delay:1.15s"/>
<rect class="grow" x="20" y="346" width="104" height="14" rx="4" fill="#3987e5" style="animation-delay:1.30s"/>
<rect class="up" x="244" y="310" width="64" height="26" rx="4" fill="#3987e5" style="animation-delay:1.20s"/>
<rect class="up" x="310" y="310" width="32" height="26" rx="4" fill="#d95926" style="animation-delay:1.35s"/>
<rect class="up" x="344" y="310" width="16" height="26" rx="4" fill="#199e70" style="animation-delay:1.50s"/>
</g>
<g transform="translate(0 46)">
<text x="70" y="150" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#2fffc0" letter-spacing="4">LIVE DASHBOARD</text>
<rect class="caret" x="273" y="135" width="10" height="18" fill="#2fffc0"/>
<text x="68" y="222" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#e2eeff" letter-spacing="-1.5">Enterprise</text>
<text x="68" y="286" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#e2eeff" letter-spacing="-1.5">Data 360</text>
<text x="70" y="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#96afc8">7 sections · search · filters · CSV export</text>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700"><rect x="70" y="372" width="116" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="128" y="394" text-anchor="middle" fill="#e2eeff">JavaScript</text><rect x="198" y="372" width="99" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="247.5" y="394" text-anchor="middle" fill="#e2eeff">Chart.js</text><rect x="309" y="372" width="82" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="350" y="394" text-anchor="middle" fill="#e2eeff">pandas</text></g>
</g>
<g transform="skewX(-18)"><rect class="sheen" x="-420" y="0" width="220" height="600" fill="url(#sh)"/></g>
</svg>
