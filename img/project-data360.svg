<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t">
  <title id="t">Enterprise Data 360 dashboard</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010810"/><stop offset=".6" stop-color="#061522"/><stop offset="1" stop-color="#0a1e30"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3987e5" stop-opacity=".45"/><stop offset="1" stop-color="#3987e5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#00c896" stop-opacity=".25"/><stop offset="1" stop-color="#00c896" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#96afc8" opacity=".14"/></pattern>
  </defs>
  <rect width="900" height="600" fill="url(#bg)"/>
  <rect width="900" height="600" fill="url(#dots)"/>
  <circle cx="680" cy="330" r="300" fill="url(#glow)"/>

  <!-- Dashboard window -->
  <g transform="translate(470 110)">
    <rect width="380" height="380" rx="18" fill="#111926" stroke="#2c4a6e" stroke-width="2"/>
    <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
      <rect x="20" y="22" width="104" height="62" rx="10" fill="#172232"/>
      <text x="32" y="46" font-size="12" fill="#96afc8">Revenue</text>
      <text x="32" y="72" font-size="21" font-weight="800" fill="#eef3f9">$15.2M</text>
      <rect x="138" y="22" width="104" height="62" rx="10" fill="#172232"/>
      <text x="150" y="46" font-size="12" fill="#96afc8">Customers</text>
      <text x="150" y="72" font-size="21" font-weight="800" fill="#eef3f9">24,563</text>
      <rect x="256" y="22" width="104" height="62" rx="10" fill="#172232"/>
      <text x="268" y="46" font-size="12" fill="#96afc8">NPS</text>
      <text x="268" y="72" font-size="21" font-weight="800" fill="#eef3f9">48</text>
    </g>
    <path d="M20 250 L60 228 L100 238 L140 220 L180 200 L220 214 L260 190 L300 172 L340 150 L360 140 V280 H20 Z" fill="url(#area)"/>
    <path d="M20 250 L60 228 L100 238 L140 220 L180 200 L220 214 L260 190 L300 172 L340 150 L360 140" fill="none" stroke="#3987e5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="360" cy="140" r="6" fill="#3987e5" stroke="#111926" stroke-width="3"/>
    <line x1="20" y1="280" x2="360" y2="280" stroke="#2f3d50" stroke-width="1.5"/>
    <g fill="#3987e5">
      <rect x="20" y="302" width="200" height="14" rx="4"/>
      <rect x="20" y="324" width="150" height="14" rx="4"/>
      <rect x="20" y="346" width="104" height="14" rx="4"/>
    </g>
    <g>
      <rect x="244" y="310" width="64" height="26" rx="4" fill="#3987e5"/>
      <rect x="310" y="310" width="32" height="26" rx="4" fill="#d95926"/>
      <rect x="344" y="310" width="16" height="26" rx="4" fill="#199e70"/>
    </g>
  </g>

  <g transform="translate(0 46)">
  <!-- Title -->
  <text x="70" y="150" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#2fffc0" letter-spacing="4">LIVE DASHBOARD</text>
  <text x="68" y="222" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#e2eeff" letter-spacing="-1.5">Enterprise</text>
  <text x="68" y="286" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#e2eeff" letter-spacing="-1.5">Data 360</text>
  <text x="70" y="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#96afc8">7 sections · search · filters · CSV export</text>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="70" y="372" width="112" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/>
    <text x="126" y="394" text-anchor="middle" fill="#e2eeff">JavaScript</text>
    <rect x="194" y="372" width="96" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/>
    <text x="242" y="394" text-anchor="middle" fill="#e2eeff">Chart.js</text>
    <rect x="302" y="372" width="84" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/>
    <text x="344" y="394" text-anchor="middle" fill="#e2eeff">pandas</text>
  </g>
  </g>
</svg>
