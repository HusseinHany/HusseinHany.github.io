<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t">
<title id="t">Sales Performance Analytics dashboard</title>
<style>
.up{transform-box:fill-box;transform-origin:50% 100%;animation:up 7s cubic-bezier(.2,.8,.2,1) infinite both}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 7s cubic-bezier(.2,.8,.2,1) infinite both}
.in{animation:in 7s ease infinite both}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 7s cubic-bezier(.3,1.4,.5,1) infinite both}
.ring{transform-box:fill-box;transform-origin:50% 50%;animation:ring 2.4s ease-out infinite}
.bob{animation:bob 3.2s ease-in-out infinite alternate}
.flow{stroke-dasharray:8 9;animation:flow 1s linear infinite}
.caret{animation:blink 1.1s steps(1) infinite}
.breathe{transform-box:fill-box;transform-origin:50% 50%;animation:breathe 6s ease-in-out infinite alternate}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes up{0%{transform:scaleY(0)}20%,90%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes grow{0%{transform:scaleX(0)}20%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes in{0%{opacity:0;transform:translateY(10px)}12%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}10%,90%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes bob{from{transform:translateY(-7px)}to{transform:translateY(7px)}}
@keyframes flow{to{stroke-dashoffset:-34}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes breathe{from{transform:scale(.9);opacity:.75}to{transform:scale(1.08);opacity:1}}
@keyframes sheen{0%{transform:translateX(0)}30%,100%{transform:translateX(1500px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#010810"/><stop offset=".6" stop-color="#061522"/><stop offset="1" stop-color="#0a1e30"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3987e5" stop-opacity=".3"/><stop offset="1" stop-color="#3987e5" stop-opacity="0"/></radialGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#96afc8" opacity=".14"/></pattern>

</defs>
<rect width="900" height="600" fill="url(#bg)"/>
<rect width="900" height="600" fill="url(#dots)"/>
<circle class="breathe" cx="670" cy="300" r="290" fill="url(#glow)"/>
<g transform="translate(470 108)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="380" height="384" rx="18" fill="#0f1826" stroke="#2c4a6e" stroke-width="2"/>
<g class="in" style="animation-delay:0.10s"><rect x="20" y="20" width="165" height="72" rx="10" fill="#172232"/>
<text x="34" y="44" font-size="12" fill="#96afc8">Total sales</text><text x="34" y="77" font-size="27" font-weight="800" fill="#eef3f9">$1.27M</text></g>
<g class="in" style="animation-delay:0.25s"><rect x="195" y="20" width="165" height="72" rx="10" fill="#172232"/>
<text x="209" y="44" font-size="12" fill="#96afc8">Eastern region</text><text x="209" y="77" font-size="27" font-weight="800" fill="#eef3f9">52%</text>
<rect x="282" y="62" width="64" height="8" rx="4" fill="#2c4a6e"/><rect class="grow" x="282" y="62" width="33" height="8" rx="4" fill="#00c896" style="animation-delay:.6s"/></g>
<text x="20" y="128" font-size="13" font-weight="700" fill="#96afc8">Average sales per month</text>
<g class="pop" style="animation-delay:2.30s"><rect x="282" y="110" width="78" height="28" rx="14" fill="#2a2208" stroke="#f5c842"/>
<text x="321" y="129" text-anchor="middle" font-size="14" font-weight="800" fill="#f5c842">↑ 2.5×</text></g>
<line x1="20" y1="336" x2="360" y2="336" stroke="#2f3d50" stroke-width="1.5"/>
<rect class="up" x="50" y="277" width="70" height="59" rx="6" fill="#3987e5" style="animation-delay:0.60s"/><text class="in" x="85" y="267" text-anchor="middle" font-size="16" font-weight="800" fill="#e2eeff" style="animation-delay:1.30s">$34.7K</text><text x="85" y="360" text-anchor="middle" font-size="13" fill="#96afc8">1996</text><rect class="up" x="160" y="248" width="70" height="88" rx="6" fill="#3987e5" style="animation-delay:0.85s"/><text class="in" x="195" y="238" text-anchor="middle" font-size="16" font-weight="800" fill="#e2eeff" style="animation-delay:1.55s">$51.4K</text><text x="195" y="360" text-anchor="middle" font-size="13" fill="#96afc8">1997</text><rect class="up" x="270" y="186" width="70" height="150" rx="6" fill="#00c896" style="animation-delay:1.10s"/><text class="in" x="305" y="176" text-anchor="middle" font-size="16" font-weight="800" fill="#e2eeff" style="animation-delay:1.80s">$88.1K</text><text x="305" y="360" text-anchor="middle" font-size="13" fill="#96afc8">1998</text>
</g>
<g transform="translate(0 46)">
<text x="70" y="150" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#2fffc0" letter-spacing="4">LIVE DASHBOARD</text>
<rect class="caret" x="273" y="135" width="10" height="18" fill="#2fffc0"/>
<text x="68" y="222" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#e2eeff" letter-spacing="-1.5">Sales</text>
<text x="68" y="286" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#e2eeff" letter-spacing="-1.5">Performance</text>
<text x="70" y="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#96afc8">Northwind orders, 1996–1998</text>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700"><rect x="70" y="372" width="73" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="106.5" y="394" text-anchor="middle" fill="#e2eeff">Excel</text><rect x="155" y="372" width="133" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="221.5" y="394" text-anchor="middle" fill="#e2eeff">Pivot Tables</text><rect x="300" y="372" width="99" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="349.5" y="394" text-anchor="middle" fill="#e2eeff">Chart.js</text></g>
</g>
<g transform="skewX(-18)"><rect class="sheen" x="-420" y="0" width="220" height="600" fill="url(#sh)"/></g>
</svg>
